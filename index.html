<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- What every patient sees in the browser tab. It said
         "sportmedical-frontend", the npm package name, and lang="en" on a
         site written entirely in Czech - which also made screen readers read
         it with English pronunciation. -->
    <title>SportMedical Diagnostics</title>
    <meta name="robots" content="noindex" />
    <!-- Inter, the face the public site uses. theme.ts has asked for it
         since day one and nothing ever loaded it, so every screen has been
         falling through to Roboto/Arial. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
