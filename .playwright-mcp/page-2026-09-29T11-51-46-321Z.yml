        - paragraph [ref=e541]: Display tabular data using semantic markup. This component is best suited for smaller amounts of data that can be rendered all at once. Gives you access to the full set of native HTML table features including row and column spans and dynamic column widths based on cell contents. Newer browsers will also support fixed table headers which gracefully degrade in older browsers, ensuring your content is accessible to the greatest number of users.
        - paragraph [ref=e542]:
          - text: For larger amounts of information, browser rendering performance can suffer and you should use the virtualized scrolling features of the div-based
          - link "table" [ref=e543] [cursor=pointer]:
            - /url: /components/table
          - text: or
          - link "table-grid" [ref=e544] [cursor=pointer]:
            - /url: /components/table-grid
          - text: components.
        - heading "Table vs. TableBuilder" [level=2] [ref=e545]
        - paragraph [ref=e546]:
          - text: If you want to pass some data in and let the component take care of rendering,
          - strong [ref=e547]: Table
          - text: is the right component. If you want control over how each cell is rendered, use
          - strong [ref=e548]: TableBuilder
          - text: along with
          - strong [ref=e549]: TableBuilderColumn
          - text: .
        - paragraph [ref=e550]:
          - text: When using
          - strong [ref=e551]: TableBuilder
          - text: ", you pass data in the same as you would with"
          - strong [ref=e552]: Table
          - text: ", then you define how each cell (and it's header) should be rendered by adding a"
          - strong [ref=e553]: TableBuilderColumn
          - text: for each column. Each
          - strong [ref=e554]: TableBuilderColumn
          - text: takes exactly one child, and that child is a function which a row of data as input, and outputs a React Node which represents the cell for that column/row pair. See the
          - link "table-builder" [ref=e555] [cursor=pointer]:
            - /url: "#table-builder"
          - text: example below for a basic example, and the following table-builder examples for more complex cases, including customizing the column header.
