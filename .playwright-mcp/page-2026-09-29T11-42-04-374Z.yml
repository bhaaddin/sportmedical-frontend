          - listitem [ref=f5e426]:
            - link "Extending the theme" [ref=f5e427] [cursor=pointer]:
              - /url: "#extending-the-theme-type"
          - listitem [ref=f5e428]:
            - link "Accessing your theme through styling utilities" [ref=f5e429] [cursor=pointer]:
              - /url: "#accessing-your-theme-through-styling-utilities"
          - listitem [ref=f5e430]:
            - link "Theme properties" [ref=f5e431] [cursor=pointer]:
              - /url: "#theme-properties"
        - heading "The benefits of a theme" [level=2] [ref=f5e432]
        - paragraph [ref=f5e433]: "The theming system that ships with Base Web provides developers with a few useful features:"
        - heading "Centralized customization" [level=3] [ref=f5e434]
        - paragraph [ref=f5e435]: The theme object allows you to configure system-wide styling values in one place. All of our components reference the theme object when assigning style values. This removes the need for certain types of styling overrides and frees you from maintaining custom versions of components simply because your interface requires a different color palette or typography scale.
        - heading "Light and dark themes" [level=3] [ref=f5e436]
        - paragraph [ref=f5e437]: Because our theme is provided to components through React’s context system, we can dynamically change the theme at any time. The most common use case is toggling between Base Web’s light and dark themes, but there are many other possibilities. For example, you could introduce controls for modifying layout density, or you could let users customize your interface in real time.
        - heading "Access to design tokens" [level=3] [ref=f5e438]
        - paragraph [ref=f5e439]:
          - text: The theme object is easily accessible when working with Base Web’s various styling utilities (including
          - code [ref=f5e440]: useStyletron
          - text: ","
          - code [ref=f5e441]: styled
          - text: ","
          - code [ref=f5e442]: withStyle
          - text: ", and"
          - code [ref=f5e443]: Block
          - text: ). This makes it easy to use consistent values when extending Base components or styling your components. Using consistent design tokens results in faster development, smaller bundle sizes, and better-looking interfaces.
        - heading "Setting up Base Web with a theme" [level=2] [ref=f5e444]
        - paragraph [ref=f5e445]: Even if you’re not interested in creating a custom theme, we require that you select a theme as part of Base Web’s boilerplate setup. Our components require a theme to assign styles.
        - paragraph [ref=f5e446]:
          - text: The theme object itself is nothing special—just an object with specific properties (a specific “shape”) that can be passed to our
          - code [ref=f5e447]: ThemeProvider
          - text: or
          - code [ref=f5e448]: BaseProvider
          - text: . Base Web components will then reference this object when assigning stylistic values such as color or font size.
        - alert [ref=f5e449]:
          - paragraph [ref=f5e451]: Make sure to reference the TypesScript definitions when customizing your theme object. Base Web components assume certain properties are on the theme object at run-time. A missing property on the theme object can lead to a runtime error.
        - heading "Default themes" [level=3] [ref=f5e452]
        - paragraph [ref=f5e453]:
          - text: We provide 2 themes out of the box,
          - code [ref=f5e454]: LightTheme
          - text: and
          - code [ref=f5e455]: DarkTheme
          - text: ", which style components in light and dark variants. If you don’t want to customize Base Web, you can use either of these ready-to-use themes as is:"
