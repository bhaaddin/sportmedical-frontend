        - heading "Theming" [level=1] [ref=f5e413]
        - paragraph [ref=f5e414]: "In this guide, we will cover the basics of theming Base Web components. We'll go over the following topics:"
        - list [ref=f5e415]:
          - listitem [ref=f5e416]:
