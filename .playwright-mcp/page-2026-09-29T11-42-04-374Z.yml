        - heading "Accessing your Theme through style utilities" [level=2] [ref=f5e653]
        - paragraph [ref=f5e654]: The theme object acts not only as a centralized API for customizing global styling properties, but it also allows developers to use consistent values when extending components or styling new components. Base Web makes access to the theme object a priority across all of our styling utilities and component overrides so that you can always use the right value.
        - paragraph [ref=f5e655]: Let's look at how you can use the theme object while extending our components and when building out your interfaces.
        - blockquote [ref=f5e656]:
