            - text: values. If you had spread these values in the methods below, Styletron would have raised warnings. In these cases, you can use a utility function that expands shorthand CSS properties to long-hand CSS properties. For this use case, you may find
            - link "inline-style-expand-shorthand" [ref=f5e659] [cursor=pointer]:
