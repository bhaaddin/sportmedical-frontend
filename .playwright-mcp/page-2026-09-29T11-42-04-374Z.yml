        - paragraph [ref=f5e524]: This is all the setup required to use our default themes (including all of the Styletron boilerplate). Now let’s look at how you might configure Base Web with a custom theme.
        - heading "Customizing your theme" [level=2] [ref=f5e525]
        - paragraph [ref=f5e526]: You could start writing a theme object from scratch if you were so inclined. We provide Flow and TypeScript definitions for the theme object so you won't miss any required theme properties. Another approach might be to take one of our default theme objects and start reassigning properties to your desired values.
        - paragraph [ref=f5e527]: However, before you go down either road, you should know that Base Web exports a handy factory function for creating theme objects.
