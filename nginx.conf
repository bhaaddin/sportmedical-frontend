# The single-page application, and the proxy in front of the API.
#
# In production this sits BEHIND Caddy, which terminates TLS and is the only
# thing published to the internet. So `$scheme` here is always "http" -- the
# hop from Caddy -- and must not be passed on as the protocol the patient used.
# The original protocol arrives from Caddy in X-Forwarded-Proto and is handed
# through untouched.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# SignalR upgrades to a WebSocket; everything else is plain HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version on error pages and headers.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Security headers on the document that actually runs script ──────────
    #
    # They were missing here entirely. The API sent a CSP on its JSON, where it
    # does almost nothing; the HTML page that executes the application -- and
    # holds the session token in localStorage -- sent none. Any XSS on this page
    # was a full account takeover with nothing in the way.
    #
    # `always` so they are sent on error responses too, not only on 200.
    #
    #   script-src 'self'      the built bundle only; no inline script exists
    #   style-src  + inline    MUI/emotion injects <style> tags at runtime
    #   font/style + Google    index.html loads Inter from Google Fonts
    #   img/blob/data          document previews are blob: URLs
    #   connect-src + wss      the SignalR hub on this same host
    #   frame-ancestors none   nobody may frame the patient's booking page
    #
    # HSTS is set by Caddy, the TLS terminator, which is the only place that
    # knows the connection was actually encrypted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://$host; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── The API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appended to what Caddy sent, so the API sees the patient's address
        # first and then the two proxies -- which is how it tells them apart.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        # The largest upload the API accepts is a 25 MiB patient document. This
        # was 50m -- double what anything could legitimately need.
        client_max_body_size 30m;
    }

    # ── Live notifications ──────────────────────────────────────────────────
    #
    # The client connects to /hubs/notifications, and nothing proxied /hubs at
    # all: in production it fell through to the SPA fallback below and got
    # index.html back, so the notification bell never received a thing. It
    # worked in development only because Vite proxies it.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A browser cannot put a header on a WebSocket, so the session token
        # travels in the URL as ?access_token=... -- and the access log writes
        # URLs out whole. Verified on the production stack: one connection, one
        # live session token in `docker logs`. Anyone who can read the logs
        # could have signed in as whoever was connected.
        access_log off;
    }

    # Liveness only. /health/ready opens a database connection and is for the
    # container orchestrator on the internal network, not for the internet.
    location = /health {
        proxy_pass http://api:8080;
        # Without this nginx sends `Host: api:8080`, which the API's host
        # filtering rejects with 400 -- an uptime monitor would have reported
        # the site down from the first minute. Found by running the stack.
        proxy_set_header Host $host;
    }

    # /openapi/ and /swagger/ used to be proxied here unconditionally. The API
    # only maps them in Development, so in production they 404'd -- until the
    # day somebody deploys with ASPNETCORE_ENVIRONMENT=Development and the full
    # API schema goes public through this door. There is no door now.

    # ── Assets, then the application ────────────────────────────────────────
    #
    # Vite fingerprints every file under /assets/ with a content hash, so those
    # may be cached for a year. Nothing else may: index.html has to be fetched
    # fresh on every visit, or a deploy leaves patients running yesterday's
    # bundle against today's API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header in a location replaces the server-level ones, so repeat
        # the ones that matter for a script file.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://$host; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
