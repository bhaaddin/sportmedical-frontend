# Keeps the live API (Render free plan) from going to sleep.
#
# The free plan puts the service to sleep after 15 minutes without a request, and the first request afterwards
# needs about a minute to wake it. This calls the anonymous health check every 10 minutes so a person at the desk
# never meets a sleeping server. It changes nothing and reads nothing private: /health only answers "ok".
#
# Scheduled workflows run only from the repository's default branch (main), which is why this file lives here.
# To stop it: delete this file (or disable the workflow in the Actions tab). A paid Render plan makes it unnecessary.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /health
        run: |
          # A cold start can take a minute: give it up to 100 s. A failure is printed, not raised, so a Render
          # outage does not mail the owner every ten minutes.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 100 https://sportmedical-api.onrender.com/health || true)
          echo "API /health answered: ${code:-no answer}"
