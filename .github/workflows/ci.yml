name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Gating step. tsc -b returns non-zero on any type error, which fails
      # the job. `vite build` does not typecheck, so without this step type
      # errors accumulate unnoticed.
      - name: Typecheck
        run: npm run typecheck

      # Kept running after a failed typecheck so one run reports everything.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Typecheck and build see none of what these cover: a chip that renders
      # the word "undefined", a tile that counts cancelled appointments as
      # today's, a query that sends the wrong parameter names and gets a
      # cheerful empty list back. Every one of those shipped green.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
